[workspace]
resolver = "2"
members = ["crates/*", "examples/tiny"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
ota-core = { path = "crates/ota-core" }
ota-spec = { path = "crates/ota-spec" }
ota-llm = { path = "crates/ota-llm" }
ota-decide = { path = "crates/ota-decide" }
ota-tools = { path = "crates/ota-tools" }
ota-runtime = { path = "crates/ota-runtime" }
ota-store = { path = "crates/ota-store" }
ota-server = { path = "crates/ota-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
